[package]
name = "offer-letter-desktop"
version = "0.1.0"
description = "Offer Letter desktop shell (spike S5)"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-notification = "=2.5.1"
serde_json = "1"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = "thin"
