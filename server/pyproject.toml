[project]
name = "offerletter"
version = "0.1.0"
description = "Offer Letter server: simulated software job with AI teammates"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.142.2", "uvicorn[standard]==0.54.0", "pydantic==2.13.5"]

[project.scripts]
offerletter = "offerletter.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerletter"]

[tool.uv]
exclude-newer = "2026-10-05T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["fixtures", ".venv"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
